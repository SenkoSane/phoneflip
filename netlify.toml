[build]
  command = "npm run build"
  publish = "dist"

# Smart detection flags Google's sample AIza… key in Firebase SDK .d.ts (node_modules)
# and the public Firebase web API key Vite inlines into dist. Keep scanning on.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "node_modules,dist"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/openai"
  to = "/.netlify/functions/openai"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
